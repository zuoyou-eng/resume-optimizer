server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 前端路由：单页应用 history 模式，全部回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 反向代理到 FastAPI 应用服务
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 上传体积限制：必须与后端 MAX_FILE_SIZE_MB（默认 10，见 docker-compose.yml
        # 与 backend/app/config.py）保持一致。若此处大于后端上限，大文件会穿过
        # nginx 却被后端拒绝，用户看到的是与体积无关的报错，难以定位。
        client_max_body_size 10m;
    }
}
