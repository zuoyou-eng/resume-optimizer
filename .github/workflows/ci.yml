name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-test:
    name: 后端测试（pytest）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: 运行测试
        # 测试使用独立 SQLite 库（见 tests/conftest.py），无需 PostgreSQL。
        # 图片 OCR 的真实引擎测试仅在 Windows 可用，非 win32 平台自动跳过，
        # 纯逻辑层与安全校验层用例在 Linux 上仍全部执行。
        run: pytest -q

      - name: 校验数据库迁移可执行且与 ORM 一致
        # 防漂移测试（test_migrations.py）强制"迁移 schema 与 ORM 元数据零差异"，
        # 防止只改模型不生成迁移导致测试全绿而部署库缺列。
        run: pytest tests/test_migrations.py -q

  frontend-build:
    name: 前端构建（npm ci + build）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        # 使用 npm ci 而非 npm install：按 lock 文件精确还原，保证构建可复现
        run: npm ci

      - name: 构建
        run: npm run build
